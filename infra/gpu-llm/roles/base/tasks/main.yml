---
- name: Базовые пакеты
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, ufw, fail2ban, openssl, python3-apt]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: SSH — усиление (drop-in, с проверкой sshd -t)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      MaxAuthTries 3
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  when: ssh_harden | bool
  notify: Reload sshd

- name: UFW — политика по умолчанию
  community.general.ufw:
    default: "{{ item.dir }}"
    policy: "{{ item.policy }}"
  loop:
    - { dir: incoming, policy: deny }
    - { dir: outgoing, policy: allow }

- name: UFW — SSH (весь мир или только admin_cidrs)
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ admin_cidrs if admin_cidrs | length > 0 else ['any'] }}"

- name: UFW — HTTPS API
  community.general.ufw:
    rule: allow
    port: "{{ api_port }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ api_allowed_cidrs if api_allowed_cidrs | length > 0 else ['any'] }}"

- name: UFW — включить
  community.general.ufw:
    state: enabled

- name: Fail2ban для sshd
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime = 1h
    mode: "0644"
  notify: Restart fail2ban

- name: Fail2ban включён
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
